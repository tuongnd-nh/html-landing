server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  # Trang lỗi tùy chỉnh — giữ nguyên mã status HTTP
  error_page 400 /errors/400.html;
  error_page 401 /errors/401.html;
  error_page 403 /errors/403.html;
  error_page 404 /errors/404.html;
  error_page 405 /errors/405.html;
  error_page 408 /errors/408.html;
  error_page 429 /errors/429.html;
  error_page 500 /errors/500.html;
  error_page 502 /errors/502.html;
  error_page 503 /errors/503.html;
  error_page 504 /errors/504.html;

  # Chỉ cho nginx nội bộ dùng file HTML lỗi; CSS vẫn tải công khai
  location ~ ^/errors/\d+\.html$ { internal; }

  location / {
    try_files $uri $uri/ =404;
  }

  # Đường dẫn thử lỗi: /test/404 -> trả về HTTP 404 kèm trang lỗi
  location = /test/400 { return 400; }
  location = /test/401 { return 401; }
  location = /test/403 { return 403; }
  location = /test/404 { return 404; }
  location = /test/405 { return 405; }
  location = /test/429 { return 429; }
  location = /test/500 { return 500; }
  location = /test/502 { return 502; }
  location = /test/503 { return 503; }
  location = /test/504 { return 504; }
}
